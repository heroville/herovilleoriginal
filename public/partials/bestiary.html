<section id="container">
    <div class="col-lg-6">
        <table class="table table-bordered">
            <tr>
                <td><u><b>Monsters</b></u></td>
            </tr>
            <tr>
                <td><b><u>Name</u></b></td>
                <td><b><u>Level</u></b></td>
                <td><b><u>Damage</u></b></td>
                <td><b><u>Health</u></b></td>
            </tr>
            <tr ng-repeat="monsterL in state.monsters | orderBy:state.sorting.monList:reverse">
                <td>{{monsterL.name}}</td>
                <td>{{monsterL.value}}</td>
                <td>{{monsterL.minDamage}}-{{monsterL.maxDamage}}</td>
                <td>{{monsterL.health}}</td>
            </tr>
        </table>
    </div>
    <div class="col-lg-6">
        <table class="table table-bordered">
            <tr>
                <td><u><b>Bosses</b></u></td>
            </tr>
            <tr>
                <td><b><u>Name</u></b></td>
                <td><b><u>Location</u></b></td>
                <td><b><u>Damage</u></b></td>
                <td><b><u>Health</u></b></td>
            </tr>
            <tr ng-repeat="monsterB in state.bosses | orderBy:state.sorting.bossList:reverse">
                <td>{{monsterB.name}}</td>
                <td><div ng-repeat="dungeona in state.dungeons | filter:{bossID:monsterB.id}">{{dungeona.name}}</div></td>
                <td>{{monsterB.minDamage}}-{{monsterB.maxDamage}}</td>
                <td>{{monsterB.health}}</td>
            </tr>
        </table>
    </div>
</section>
